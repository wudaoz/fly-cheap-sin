name: collect

on:
  schedule:
    - cron: "40 0 * * *"   # 00:40 UTC = 08:40 Asia/Singapore. GitHub cron is UTC only and may start late by minutes.
  workflow_dispatch:        # Actions → collect → Run workflow: collect right now
  push:                     # page / rule / data changes redeploy the site without spending SerpApi requests
    branches: [main]
    paths: [index.html, settings.json, alerts.py, build_bundle.py, .github/workflows/collect.yml, "data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect fares from SerpApi (7 requests)
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 collect.py data

      - name: Evaluate alert rules
        if: github.event_name != 'push'
        run: python3 alerts.py data

      - name: Build data/bundle.json
        run: python3 build_bundle.py data

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/bundle.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
